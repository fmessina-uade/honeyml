name: CI

# Corre en cada push a main o develop y en cada PR contra main, para que una configuración rota de
# los sensores o del pipeline aparezca antes de llegar al VPS. Revisa los scripts de shell, los
# archivos YAML y los de compose, corre las pruebas unitarias, controla el formato y los tipos del
# código Python y busca las trampas conocidas de la configuración de los honeypots. Las pruebas de
# integración quedan afuera porque necesitan los sensores corriendo en Docker.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # todo lo que no es Python; el formato y los tipos de Python los revisa `quality`
  lint:
    name: Lint de shell, YAML y compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck de los scripts del VPS
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./infra/vps/scripts
          severity: warning

      - name: shellcheck de los scripts del proyecto
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

      - name: shellcheck de los scripts del Elastic Stack
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./infra/elastic/scripts
          severity: warning

      - name: yamllint
        run: |
          pip install yamllint --quiet
          yamllint \
            infra/honeypots/docker-compose.yml \
            infra/honeypots/docker-compose.dev.yml \
            infra/elastic/docker-compose.yml \
            infra/elastic/docker-compose.dev.yml \
            infra/elastic/filebeat/filebeat.yml \
            infra/elastic/filebeat/filebeat.dev.yml \
            infra/elastic/logstash/config/logstash.yml \
            .github/workflows/ci.yml

      - name: Archivos de compose válidos
        run: |
          docker compose \
            -f infra/honeypots/docker-compose.yml \
            config --quiet
          docker compose \
            -f infra/honeypots/docker-compose.yml \
            -f infra/honeypots/docker-compose.dev.yml \
            config --quiet
          docker compose \
            --env-file infra/elastic/.env.example \
            -f infra/elastic/docker-compose.yml \
            -f infra/elastic/docker-compose.dev.yml \
            config --quiet

  # pruebas unitarias de Python, que no necesitan Docker
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Con pytest suelto, una prueba que importa el paquete falla por una dependencia faltante
      # antes de llegar al código, así que se instala el proyecto con los extras que la suite usa.
      # `[agent]` trae langgraph, redis y pydantic; `[analysis]` trae numpy, pandas y scikit-learn,
      # que entran por la cadena de `agent/tools.py` a `features/arquetipos.py`; `[api]` trae
      # FastAPI, de donde sale el cliente que usan las pruebas de la API. El archivo que va con
      # `-c` fija las mismas versiones que corren en producción, así lo que se prueba es lo que se
      # despliega.
      - name: Instalar el proyecto con sus extras
        run: pip install -e ".[agent,analysis,api,dev]" -c infra/analisis/versiones.txt

      - name: pytest
        run: pytest tests/unit/ -v --tb=short

  # El hook de pre-commit revisa el formato y los tipos, pero se puede saltear con
  # `git commit --no-verify`. Este job los vuelve a revisar en cada push y en cada PR, así un commit
  # que se salteó el hook igual queda revisado.
  quality:
    name: Formato y tipos de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Se instalan todos los extras que usa src/ para que mypy vea los mismos tipos que en local.
      # Sin `[agent]` falta langgraph, el grafo se verifica contra un módulo que mypy no puede leer
      # y el job termina revisando menos que `make lint`. Las versiones son las de producción.
      - name: Instalar el proyecto con sus extras
        run: pip install -e ".[agent,analysis,api,dev]" types-requests -c infra/analisis/versiones.txt

      - name: ruff
        run: |
          ruff check src/ scripts/ tests/
          ruff format --check src/ scripts/ tests/

      # La línea no repite `--ignore-missing-imports` porque ya está en [tool.mypy] de
      # pyproject.toml, y con dos copias las configuraciones pueden separarse sin que nadie lo note.
      - name: mypy
        run: mypy src/

  # trampas de la configuración de los honeypots que rompen cosas en silencio si están mal
  config-validation:
    name: Configuración de los honeypots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5

      # cowrie solo carga userdb.txt si está en ASCII puro
      - name: userdb.txt en ASCII puro
        run: |
          python3 -c "
          with open('infra/honeypots/cowrie/userdb.txt', 'rb') as f:
              data = f.read()
          bad = [(i, b) for i, b in enumerate(data) if b > 127]
          if bad:
              print(f'FALLA: byte no ASCII 0x{bad[0][1]:02x} en la posición {bad[0][0]}')
              exit(1)
          print('OK: userdb.txt está en ASCII puro')
          "

      # si las rutas no coinciden con el directorio de trabajo de cowrie, el honeypot arranca vacío
      - name: Rutas de cowrie.cfg
        run: |
          python3 -c "
          import configparser, sys
          cfg = configparser.ConfigParser()
          cfg.read('infra/honeypots/cowrie/cowrie.cfg')
          errors = []
          if cfg.get('honeypot', 'contents_path', fallback='') != 'honeyfs':
              errors.append('contents_path tiene que ser honeyfs')
          if cfg.get('honeypot', 'txtcmds_path', fallback='') != 'src/cowrie/data/txtcmds':
              errors.append('txtcmds_path tiene que ser src/cowrie/data/txtcmds')
          if errors:
              print('FALLA:', errors)
              sys.exit(1)
          print('OK: las rutas de cowrie.cfg son correctas')
          "

      # nunca dejar que se filtren claves ni malware capturado al repositorio
      - name: .gitignore cubre los secretos
        run: |
          python3 -c "
          import sys
          content = open('.gitignore').read()
          required = ['*.pkl', '*.pem', '*.key', '*.pcap', '.env', 'id_rsa']
          missing = [p for p in required if p not in content]
          if missing:
              print('FALLA: a .gitignore le faltan', missing)
              sys.exit(1)
          print('OK: .gitignore cubre los patrones sensibles')
          "
