name: CI

# Runs on every push/PR to main. Keeps infra + configs honest before they reach the VPS.
# Covered: shell/yaml/compose linting, python unit tests, format and type checks, honeypot config
# sanity checks. Not covered: the integration tests, which need Docker and live sensors.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # everything that isn't python: shell scripts, yaml, compose files
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (VPS scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./infra/vps/scripts
          severity: warning

      - name: shellcheck (project scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

      - name: shellcheck (Elastic Stack scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./infra/elastic/scripts
          severity: warning

      - name: yamllint
        run: |
          pip install yamllint --quiet
          yamllint \
            infra/honeypots/docker-compose.yml \
            infra/honeypots/docker-compose.dev.yml \
            infra/elastic/docker-compose.yml \
            infra/elastic/docker-compose.dev.yml \
            infra/elastic/filebeat/filebeat.yml \
            infra/elastic/filebeat/filebeat.dev.yml \
            infra/elastic/logstash/config/logstash.yml \
            .github/workflows/ci.yml

      - name: compose files parse
        run: |
          docker compose \
            -f infra/honeypots/docker-compose.yml \
            config --quiet
          docker compose \
            -f infra/honeypots/docker-compose.yml \
            -f infra/honeypots/docker-compose.dev.yml \
            config --quiet
          docker compose \
            --env-file infra/elastic/.env.example \
            -f infra/elastic/docker-compose.yml \
            -f infra/elastic/docker-compose.dev.yml \
            config --quiet

  # python unit tests, no Docker needed
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # El proyecto con los extras que las pruebas importan de verdad, no solo pytest.
      #
      # `[agent]` trae langgraph, redis y pydantic; `[analysis]` trae numpy, pandas y scikit-learn,
      # que entran por la cadena `agent/tools.py` -> `features/arquetipos.py`. Mientras las únicas
      # pruebas leían archivos de configuración alcanzaba con pytest suelto, y el día que una
      # importó el paquete el job pasó a fallar por dependencias faltantes, no por el código.
      - name: install
        run: pip install -e ".[agent,analysis,dev]"

      - name: pytest
        run: pytest tests/unit/ -v --tb=short

  # Formato y tipos. Existían solo en el hook de pre-commit, que se puede saltear con --no-verify:
  # sin esto, un commit sin verificar entraba a main sin que nada lo revisara.
  quality:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Todos los extras que usa src/, para que mypy vea los mismos tipos que ve en local.
      #
      # Sin `[agent]` no hay langgraph, y entonces el grafo se verifica contra un módulo que mypy
      # no puede leer: la puerta dice verificar tipos y verifica menos que la máquina de quien
      # escribe. Con los extras completos, esto y `make lint` dan el mismo veredicto.
      - name: install
        run: pip install -e ".[agent,analysis,api,dev]" types-requests

      - name: ruff
        run: |
          ruff check src/ scripts/ tests/
          ruff format --check src/ scripts/ tests/

      # Sin `--ignore-missing-imports` en la línea: ya está en [tool.mypy] de pyproject.toml, y
      # repetirlo acá invitaba a que las dos configuraciones se separaran sin que nadie lo notara.
      - name: mypy
        run: mypy src/

  # honeypot config gotchas that break things silently if wrong
  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5

      # cowrie only loads userdb.txt if it's plain ascii
      - name: userdb.txt is pure ascii
        run: |
          python3 -c "
          with open('infra/honeypots/cowrie/userdb.txt', 'rb') as f:
              data = f.read()
          bad = [(i, b) for i, b in enumerate(data) if b > 127]
          if bad:
              print(f'FAIL: non-ascii byte 0x{bad[0][1]:02x} at position {bad[0][0]}')
              exit(1)
          print('OK: userdb.txt is pure ascii')
          "

      # these must match cowrie's working dir, or the honeypot boots empty
      - name: cowrie.cfg paths
        run: |
          python3 -c "
          import configparser, sys
          cfg = configparser.ConfigParser()
          cfg.read('infra/honeypots/cowrie/cowrie.cfg')
          errors = []
          if cfg.get('honeypot', 'contents_path', fallback='') != 'honeyfs':
              errors.append('contents_path should be honeyfs')
          if cfg.get('honeypot', 'txtcmds_path', fallback='') != 'src/cowrie/data/txtcmds':
              errors.append('txtcmds_path should be src/cowrie/data/txtcmds')
          if errors:
              print('FAIL:', errors)
              sys.exit(1)
          print('OK: cowrie.cfg paths look right')
          "

      # never leak keys or captured malware into the repo
      - name: .gitignore covers secrets
        run: |
          python3 -c "
          import sys
          content = open('.gitignore').read()
          required = ['*.pkl', '*.pem', '*.key', '*.pcap', '.env', 'id_rsa']
          missing = [p for p in required if p not in content]
          if missing:
              print('FAIL: .gitignore missing:', missing)
              sys.exit(1)
          print('OK: .gitignore covers the sensitive patterns')
          "
