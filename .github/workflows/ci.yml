name: CI

# Runs on every push/PR to main. Keeps infra + configs honest before they reach the VPS.
# Covered: shell/yaml/compose linting, python unit tests, honeypot config sanity checks.
# Not yet: integration tests (need Docker + live honeypots) and the ML/agent code (still ahead).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # everything that isn't python: shell scripts, yaml, compose files
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (VPS scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./infra/vps/scripts
          severity: warning

      - name: shellcheck (project scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

      - name: shellcheck (Elastic Stack scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./infra/elastic/scripts
          severity: warning

      - name: yamllint
        run: |
          pip install yamllint --quiet
          yamllint \
            infra/honeypots/docker-compose.yml \
            infra/honeypots/docker-compose.dev.yml \
            infra/elastic/docker-compose.yml \
            infra/elastic/docker-compose.dev.yml \
            infra/elastic/filebeat/filebeat.yml \
            infra/elastic/filebeat/filebeat.dev.yml \
            infra/elastic/logstash/config/logstash.yml \
            .github/workflows/ci.yml

      - name: compose files parse
        run: |
          docker compose \
            -f infra/honeypots/docker-compose.yml \
            config --quiet
          docker compose \
            -f infra/honeypots/docker-compose.yml \
            -f infra/honeypots/docker-compose.dev.yml \
            config --quiet
          docker compose \
            --env-file infra/elastic/.env.example \
            -f infra/elastic/docker-compose.yml \
            -f infra/elastic/docker-compose.dev.yml \
            config --quiet

  # python unit tests, no Docker needed
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install pytest
        run: pip install pytest

      - name: pytest
        run: pytest tests/unit/ -v --tb=short

  # honeypot config gotchas that break things silently if wrong
  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5

      # cowrie only loads userdb.txt if it's plain ascii
      - name: userdb.txt is pure ascii
        run: |
          python3 -c "
          with open('infra/honeypots/cowrie/userdb.txt', 'rb') as f:
              data = f.read()
          bad = [(i, b) for i, b in enumerate(data) if b > 127]
          if bad:
              print(f'FAIL: non-ascii byte 0x{bad[0][1]:02x} at position {bad[0][0]}')
              exit(1)
          print('OK: userdb.txt is pure ascii')
          "

      # these must match cowrie's working dir, or the honeypot boots empty
      - name: cowrie.cfg paths
        run: |
          python3 -c "
          import configparser, sys
          cfg = configparser.ConfigParser()
          cfg.read('infra/honeypots/cowrie/cowrie.cfg')
          errors = []
          if cfg.get('honeypot', 'contents_path', fallback='') != 'honeyfs':
              errors.append('contents_path should be honeyfs')
          if cfg.get('honeypot', 'txtcmds_path', fallback='') != 'src/cowrie/data/txtcmds':
              errors.append('txtcmds_path should be src/cowrie/data/txtcmds')
          if errors:
              print('FAIL:', errors)
              sys.exit(1)
          print('OK: cowrie.cfg paths look right')
          "

      # never leak keys or captured malware into the repo
      - name: .gitignore covers secrets
        run: |
          python3 -c "
          import sys
          content = open('.gitignore').read()
          required = ['*.pkl', '*.pem', '*.key', '*.pcap', '.env', 'id_rsa']
          missing = [p for p in required if p not in content]
          if missing:
              print('FAIL: .gitignore missing:', missing)
              sys.exit(1)
          print('OK: .gitignore covers the sensitive patterns')
          "
