repos:
  # los hooks estándar de pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: valida la sintaxis sin construir las etiquetas propias (docker-compose usa !override)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # shellcheck: revisa los scripts de bash (usa el binario del sistema: brew install shellcheck)
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        args: [--severity=warning]
        files: \.sh$

  # yamllint: validación de YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file=.yamllint.yml]

  # ruff - linting y formato Python (reemplaza flake8 + isort + pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy: Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # mypy corre en un entorno propio y aislado: no ve el .venv del proyecto, así que las
        # bibliotecas que hay que tipar se declaran acá. `redis` va como paquete real y no como
        # types-redis porque redis-py trae sus propias anotaciones (py.typed) desde la 4.2, y el
        # paquete de stubs está deprecado por eso mismo.
        additional_dependencies: [types-requests, fastapi, redis>=5.0]
        pass_filenames: false
        args: [--ignore-missing-imports, src/]
        # solo corre cuando hay archivos bajo src/
        files: ^src/

  # Conventional Commits: valida el mensaje del commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat      # funcionalidad nueva
          - fix       # corrección de un defecto
          - docs      # solo documentación y comentarios
          - style     # formato, sin cambio de lógica
          - refactor  # refactor, sin funcionalidad nueva ni corrección
          - test      # se agregan o arreglan pruebas
          - chore     # mantenimiento (dependencias, CI, herramientas)
          - infra     # infraestructura (scripts del VPS, Docker)
          - perf      # mejoras de rendimiento
