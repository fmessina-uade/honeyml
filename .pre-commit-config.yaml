repos:
  # standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: check syntax without building custom tags (docker-compose uses !override)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # shellcheck: lints bash scripts (uses the system binary: brew install shellcheck)
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        args: [--severity=warning]
        files: \.sh$

  # yamllint: YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file=.yamllint.yml]

  # ruff - linting y formato Python (reemplaza flake8 + isort + pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy: Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, fastapi]
        pass_filenames: false
        args: [--ignore-missing-imports, src/]
        # only runs when there are files under src/
        files: ^src/

  # Conventional Commits: validates the commit message
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat      # new feature
          - fix       # bug fix
          - docs      # docs only
          - style     # formatting, no logic change
          - refactor  # refactor, no new feature or fix
          - test      # add or fix tests
          - chore     # maintenance (deps, CI, tooling)
          - infra     # infrastructure changes (VPS scripts, Docker)
          - perf      # performance improvements
