repos:
  # Hooks estándar de pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: valida sintaxis sin construir tags custom (docker-compose usa !override)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # shellcheck — linting de scripts bash (usa el binario del sistema: brew install shellcheck)
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        args: [--severity=warning]
        files: \.sh$

  # yamllint — validación de YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file=.yamllint.yml]

  # ruff — linting y formato Python (reemplaza flake8 + isort + pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy — verificación de tipos Python
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        pass_filenames: false
        args: [--ignore-missing-imports, src/]
        # Solo corre cuando haya archivos en src/ (Fase 2+)
        files: ^src/

  # Conventional Commits — valida el mensaje del commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat      # nueva funcionalidad
          - fix       # corrección de bug
          - docs      # solo documentación
          - style     # formato, sin cambio de lógica
          - refactor  # refactoring sin nueva funcionalidad ni fix
          - test      # agregar o corregir tests
          - chore     # mantenimiento (deps, CI, tooling)
          - infra     # cambios de infraestructura (scripts VPS, Docker)
          - perf      # mejoras de rendimiento
