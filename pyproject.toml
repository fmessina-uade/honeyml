[project]
name = "honeyml"
version = "0.1.0"
description = "HoneyML — Plataforma de inteligencia de amenazas con honeypots y Agentic AI"
requires-python = ">=3.11"

[project.optional-dependencies]
# Análisis exploratorio y feature engineering (Fase 2). Instalar con: pip install -e ".[analysis]"
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "pyarrow>=15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requiere contenedores corriendo (make dev-up)",
]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
