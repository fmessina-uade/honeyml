[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeyml"
version = "0.1.0"
description = "HoneyML - open-source threat intelligence platform: honeypots + Agentic AI"
requires-python = ">=3.11"

[project.optional-dependencies]
# EDA and feature engineering. Install with: pip install -e ".[analysis]"
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "pyarrow>=15",
]
# API that feeds the educational dashboard. Install with: pip install -e ".[api]"
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# Agentic triage engine. Install with: pip install -e ".[agent]"
# The inference provider is deliberately absent: the engine reaches it through an adapter
# (see ADR on provider substitution), so the dependency belongs to the adapter, not here.
agent = [
    "langgraph>=0.2",
    "redis>=5.0",
    "pydantic>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requiere contenedores corriendo (make dev-up)",
]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
