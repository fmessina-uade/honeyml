[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeyml"
version = "0.1.0"
description = "HoneyML - open-source threat intelligence platform: honeypots + Agentic AI"
# 3.12 es lo que corre en todos lados: el servidor (Ubuntu 24.04 trae 3.12.3), el entorno de
# desarrollo y el hook de pre-commit. Antes acá decía 3.11, que no corría en ningún lado (solo
# estaba declarado en CI), y esa diferencia entre lo declarado y lo real hacía que la verificación
# de tipos no pudiera correr localmente.
requires-python = ">=3.12"

[project.optional-dependencies]
# Análisis exploratorio e ingeniería de características. Se instala con: pip install -e ".[analysis]"
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "pyarrow>=15",
]
# La API que alimenta el panel educativo. Se instala con: pip install -e ".[api]"
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# Motor de triaje agéntico. Se instala con: pip install -e ".[agent]"
# El proveedor de inferencia no está acá a propósito: el motor lo alcanza a través de un adaptador
# (ver el ADR sobre sustitución de proveedor), así que la dependencia es del adaptador y no de acá.
agent = [
    "langgraph>=0.2",
    "redis>=5.0",
    "pydantic>=2.9",
    # Solo el paquete de certificados raíz, no un cliente HTTP: el adaptador habla por `urllib`.
    # Se declara porque el adaptador lo usa de respaldo cuando el intérprete no tiene almacén de
    # certificados (el caso del Python de python.org en macOS sin `Install Certificates.command`),
    # y hasta ahora venía arrastrado por otra dependencia, que es una forma frágil de depender.
    "certifi>=2024.2",
]
# Herramientas de verificación. Instalar con: pip install -e ".[dev]"
# Estaban declaradas en la configuración de pytest y ruff pero no como dependencia, así que
# `make test` respondía "pytest no instalado" y la suite no se corría nunca.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Clavado a la misma versión que el hook de .pre-commit-config.yaml: dos versiones distintas
    # dan dos veredictos distintos. Está para poder invocarlo a mano sobre un archivo puntual;
    # `make lint` no lo corre, por el motivo que explica [tool.mypy] más abajo.
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requiere contenedores corriendo (make dev-up)",
]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
# Tiene que coincidir con requires-python y con CI. Cuando decía 3.11 y el entorno real era 3.12,
# mypy no podía parsear los stubs de numpy, que usan sintaxis de 3.12, y abortaba antes de mirar
# una línea del proyecto, con lo que la verificación de tipos solo corría en el hook.
python_version = "3.12"
strict = true
ignore_missing_imports = true
