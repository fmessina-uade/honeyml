<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1117" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&family=Caveat:wght@500;600&family=Geist:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>HoneyML - Panel Analítico</title>
    <style>
      html { background: #0d1117; }
      html[data-tema='claro'] { background: #f4f1ea; }
    </style>
    <script>
      // El tema se decide antes de pintar: si esperara a React, el panel aparecería un instante
      // con el tema equivocado. La preferencia guardada manda; si no hay, el del sistema.
      (function () {
        var preferencia = 'sistema';
        try {
          preferencia = localStorage.getItem('honeyml-panel-tema') || 'sistema';
        } catch (e) {}
        var claro =
          preferencia === 'claro' ||
          (preferencia === 'sistema' &&
            window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.tema = claro ? 'claro' : 'oscuro';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
