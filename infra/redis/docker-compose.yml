services:

  # Redis Streams: bus en tiempo real entre el pipeline de normalización y el motor de triaje.
  #
  # Vive en la zona de análisis y no en la de captura: los sensores nunca lo alcanzan. El pipeline
  # publica acá después de normalizar, y el motor consume con un grupo de consumidores, que es lo
  # que da el acuse explícito: un evento tomado y no confirmado queda pendiente, y se puede reclamar
  # si el consumidor se muere en el medio.
  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --save ""
    volumes:
      - redis_data:/data
    # atado a loopback, nunca expuesto en la interfaz pública del VPS (RNF-03)
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - elastic_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${REDIS_MEM_LIMIT:-768m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # se une a la red de análisis para que Logstash pueda publicar sin cruzar de zona
  elastic_net:
    external: true
    name: elastic_net

volumes:
  redis_data:
    name: redis_data
