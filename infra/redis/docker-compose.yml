services:

  # Redis Streams: real-time bus between the normalization pipeline and the triage engine.
  #
  # It sits in the analysis zone, not the capture zone: the sensors never reach it. The pipeline
  # publishes here after normalizing, and the engine consumes with a consumer group, which is what
  # gives explicit acknowledgement — an event taken and not confirmed stays pending and can be
  # reclaimed if the consumer dies mid-processing.
  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --save ""
    volumes:
      - redis_data:/data
    # bound to loopback, never exposed on the VPS public interface (RNF-03)
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - elastic_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${REDIS_MEM_LIMIT:-768m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # joins the analysis network so Logstash can publish without crossing zones
  elastic_net:
    external: true
    name: elastic_net

volumes:
  redis_data:
    name: redis_data
