# Motor de triaje y API del panel, en la zona de análisis.
#
# Se unen a la red de Elasticsearch y del bus, y a ninguna otra: los sensores viven en honeypot_net y
# no tienen ruta hasta acá. Ninguno de los dos publica un puerto hacia afuera; la API escucha solo
# en loopback y se alcanza por túnel SSH.
#
# Necesita el stack de Elastic y el bus levantados, y la clave del proveedor en el .env de la raíz.

x-analisis: &analisis
  build:
    context: ../..
    dockerfile: infra/analisis/Dockerfile
  image: honeyml-analisis
  restart: unless-stopped
  networks:
    - elastic_net
  volumes:
    # los artefactos derivados se generan en la estación de trabajo y se publican al servidor
    - ../../data/processed:/app/data/processed:ro
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  # Consume el bus, razona cada conducta nueva y guarda la decisión.
  #
  # Va con --todo porque después de un corte largo el atraso puede superar el tope que frena a una
  # corrida manual, y un servicio no puede quedarse esperando que alguien confirme. Lo que acota el
  # gasto acá es el tope de la clave en el proveedor. El nombre es fijo para que cada reinicio no
  # sume un consumidor nuevo al grupo.
  motor:
    <<: *analisis
    container_name: motor
    hostname: motor
    command: ["python", "-m", "honeyml.agent.motor", "--reutilizar", "--todo", "--nombre", "motor"]
    env_file:
      - ../../.env
    environment:
      - ES_URL=http://elasticsearch:9200
      - BUS_HOST=valkey
    mem_limit: ${MOTOR_MEM_LIMIT:-1g}
    cpus: "1.0"

  # La única puerta del navegador a Elasticsearch.
  api:
    <<: *analisis
    container_name: api
    hostname: api
    # Usuario y grupo propios, y no el grupo que deja la imagen: useradd --system le asigna el 999,
    # que en el servidor es systemd-journal, y con /var/log montado la API podría leer el journal
    # entero. Va entre comillas porque YAML 1.1 lee dos números separados por dos puntos como un
    # sexagesimal.
    user: "10001:10001"
    command: ["uvicorn", "honeyml.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # La clave del bus entra por el mismo archivo que la del motor, resuelto contra la ubicación del
    # compose y no contra el directorio desde donde se lo corre: así un recreado manual de la API la
    # recibe igual, cosa que una interpolación del entorno no garantiza. Hace falta para que, al
    # corregir un veredicto, la API saque del repertorio la firma de la decisión corregida; sin la
    # clave, con el bus autenticado ese olvido fallaría callado y el error se seguiría copiando.
    env_file:
      - ../../.env
    environment:
      - ES_URL=http://elasticsearch:9200
      - BUS_HOST=valkey
    volumes:
      - ../../data/processed:/app/data/processed:ro
      # Los registros que escriben los scripts del anfitrión, para la auditoría del superadmin. Va el
      # directorio entero porque Docker crea un directorio en el lugar de un archivo que todavía no
      # existe, y eso rompería al script que después quiera escribirlo. La API corre sin privilegios
      # y solo abre los que nombra registros.py. Igual alcanza lo que /var/log deja legible para
      # cualquier usuario; dejarla afuera de eso pide que los scripts escriban en un directorio propio.
      - /var/log:/registros-del-servidor:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # una conexión y nada más: /api/health consulta Elasticsearch, y una sonda cada medio minuto
      # no tiene por qué agregarle carga
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 8000)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: ${API_MEM_LIMIT:-768m}
    cpus: "0.5"

networks:
  elastic_net:
    external: true
    name: elastic_net
