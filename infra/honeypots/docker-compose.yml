services:

  # Cowrie SSH/Telnet honeypot: captures credentials and attacker TTPs
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    hostname: cowrie-sensor
    restart: unless-stopped
    networks:
      - honeypot_net
    ports:
      - "0.0.0.0:22:2222/tcp"   # SSH honeypot
      - "0.0.0.0:23:2223/tcp"   # Telnet honeypot
    volumes:
      # process CWD = /cowrie/cowrie-git (not /cowrie), every path hangs off that
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie_downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      - cowrie_tty:/cowrie/cowrie-git/var/lib/cowrie/tty
    healthcheck:
      # the image has no /bin/sh or nc, but python3 is there in the virtualenv
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 2222)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - COWRIE_TELNET_ENABLED=yes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    # 512m left it at 88% after four weeks of capture, too close to an OOM kill
    mem_limit: 1g
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Dionaea multiprotocolo - SMB, HTTP, FTP, MySQL, MSSQL, SIP
  dionaea:
    build:
      context: ./dionaea
      dockerfile: Dockerfile
    container_name: dionaea
    hostname: dionaea-sensor
    restart: unless-stopped
    networks:
      - honeypot_net
    ports:
      - "0.0.0.0:21:21/tcp"      # FTP
      - "0.0.0.0:80:80/tcp"      # HTTP
      - "0.0.0.0:443:443/tcp"    # HTTPS
      - "0.0.0.0:445:445/tcp"    # SMB
      - "0.0.0.0:135:135/tcp"    # MSRPC
      - "0.0.0.0:1433:1433/tcp"  # MSSQL
      - "0.0.0.0:3306:3306/tcp"  # MySQL
      - "0.0.0.0:5060:5060/tcp"  # SIP TCP
      - "0.0.0.0:5060:5060/udp"  # SIP UDP
    volumes:
      # mount the whole /opt/dionaea/var/: the entrypoint's init_lib/init_log need to find the
      # empty dir to build the structure with dionaea:dionaea ownership
      # custom config (trimmed logging, log_json, SIP/pptp off) baked into the image via the
      # Dockerfile (COPY to template/). Don't bind-mount over /opt/dionaea/etc: it breaks init_etc.
      - dionaea_var:/opt/dionaea/var
    healthcheck:
      # nc isn't in the image; bash /dev/tcp needs no external binary.
      # generous timeout/retries: under heavy attack load Dionaea pegs a core and can be slow to
      # answer the probe, which used to flag it unhealthy while it was actually capturing fine.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80' && bash -c '</dev/tcp/127.0.0.1/445'"]
      interval: 45s
      timeout: 20s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    # cap_drop:ALL doesn't work with Dionaea: the entrypoint writes dirs owned by dionaea:dionaea.
    # The image is from 2020 and assumes root caps. Egress is blocked by iptables DOCKER-USER.
    mem_limit: 1g
    # the 2020 image leaks threads under sustained load until it cannot fork;
    # the cap keeps a runaway container from taking the host's PIDs with it
    pids_limit: 512
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# internal bridge network for the honeypots.
# inbound allowed (receives attacks from the internet), egress blocked via iptables DOCKER-USER (02_firewall.sh)
networks:
  honeypot_net:
    name: honeypot_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: br-honeypot
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

# IMPORTANT: these volumes can hold captured malware, never commit them
volumes:
  cowrie_logs:
    name: honeypots_cowrie_logs
  cowrie_downloads:
    name: honeypots_cowrie_downloads
  cowrie_tty:
    name: honeypots_cowrie_tty
  dionaea_var:
    name: honeypots_dionaea_var
