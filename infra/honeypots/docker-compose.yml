services:

  # Honeypot Cowrie de SSH y Telnet: captura credenciales y las TTP de los atacantes
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    hostname: cowrie-sensor
    restart: unless-stopped
    networks:
      - honeypot_net
    ports:
      - "0.0.0.0:22:2222/tcp"   # SSH honeypot
      - "0.0.0.0:23:2223/tcp"   # Telnet honeypot
    volumes:
      # el CWD del proceso es /cowrie/cowrie-git (no /cowrie), y todas las rutas cuelgan de ahí
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie_downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      - cowrie_tty:/cowrie/cowrie-git/var/lib/cowrie/tty
    healthcheck:
      # la imagen no trae /bin/sh ni nc, pero python3 sí está en el entorno virtual
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 2222)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - COWRIE_TELNET_ENABLED=yes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    # con 512m, unas semanas de captura continua lo dejan muy cerca de un OOM kill
    mem_limit: 1g
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Dionaea multiprotocolo - SMB, HTTP, FTP, MySQL, MSSQL, SIP
  dionaea:
    build:
      context: ./dionaea
      dockerfile: Dockerfile
    container_name: dionaea
    hostname: dionaea-sensor
    restart: unless-stopped
    networks:
      - honeypot_net
    ports:
      - "0.0.0.0:21:21/tcp"      # FTP
      - "0.0.0.0:80:80/tcp"      # HTTP
      - "0.0.0.0:443:443/tcp"    # HTTPS
      - "0.0.0.0:445:445/tcp"    # SMB
      - "0.0.0.0:135:135/tcp"    # MSRPC
      - "0.0.0.0:1433:1433/tcp"  # MSSQL
      - "0.0.0.0:3306:3306/tcp"  # MySQL
      - "0.0.0.0:5060:5060/tcp"  # SIP TCP
      - "0.0.0.0:5060:5060/udp"  # SIP UDP
    volumes:
      # Se monta todo /opt/dionaea/var/: init_lib e init_log del entrypoint necesitan encontrar el
      # directorio vacío para armar la estructura con dueño dionaea:dionaea.
      # La configuración propia (logging recortado, log_json, SIP y pptp apagados) viene cocinada en
      # la imagen por el Dockerfile (COPY a template/). No hay que bind-montar encima de
      # /opt/dionaea/etc: rompe init_etc.
      - dionaea_var:/opt/dionaea/var
    healthcheck:
      # NO es una sonda de puerto. Por dos motivos que acá no la dejan funcionar:
      #  - Dionaea escucha con listen.mode=getifaddrs, que saltea loopback, así que 127.0.0.1 lo
      #    rechaza.
      #  - Bajo carga sostenida clava un núcleo y tarda más de dos minutos en completar un
      #    handshake, incluso contra su propia dirección, mientras sigue capturando perfecto.
      # Además la falla a detectar es otra: el proceso sigue vivo y el puerto sigue aceptando
      # (eso es docker-proxy, no Dionaea) mientras deja de procesar en silencio. La única señal que
      # lo agarra es que el registro se queda callado.
      test:
        - CMD-SHELL
        - >-
          pgrep -x dionaea >/dev/null &&
          [ $$(( $$(date +%s) - $$(stat -c %Y /opt/dionaea/var/lib/dionaea/dionaea.json) )) -lt 1800 ]
      interval: 60s
      timeout: 10s
      retries: 3
      # el registro tiene que estar escrito hace poco; tras un reinicio eso se hereda de antes
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    # cap_drop:ALL no funciona con Dionaea: el entrypoint escribe directorios con dueño
    # dionaea:dionaea. La imagen es de 2020 y da por sentadas las capacidades de root. La salida a
    # internet la bloquea iptables en DOCKER-USER.
    mem_limit: 1g
    # la imagen de 2020 pierde hilos bajo carga sostenida hasta que no puede hacer fork;
    # el tope evita que un contenedor desbocado se lleve puestos los PID del anfitrión
    pids_limit: 512
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# red bridge interna de los honeypots.
# entrada permitida (reciben ataques de internet), salida bloqueada con iptables en DOCKER-USER
# (02_firewall.sh). Los sensores no se hablan entre sí: un atacante que gane ejecución en uno no
# puede usarlo para llegar al otro. DOCKER-USER repite ese descarte, porque se evalúa antes que las
# reglas con que Docker implementa enable_icc.
networks:
  honeypot_net:
    name: honeypot_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: br-honeypot
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"

# IMPORTANTE: estos volúmenes pueden contener malware capturado, nunca se versionan
volumes:
  cowrie_logs:
    name: honeypots_cowrie_logs
  cowrie_downloads:
    name: honeypots_cowrie_downloads
  cowrie_tty:
    name: honeypots_cowrie_tty
  dionaea_var:
    name: honeypots_dionaea_var
