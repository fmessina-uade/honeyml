services:

  # Cowrie SSH/Telnet honeypot — captura credenciales y TTPs de atacantes
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    hostname: cowrie-sensor
    restart: unless-stopped
    networks:
      - honeypot_net
    ports:
      - "0.0.0.0:22:2222/tcp"   # SSH honeypot
      - "0.0.0.0:23:2223/tcp"   # Telnet honeypot
    volumes:
      # CWD del proceso = /cowrie/cowrie-git (no /cowrie), todos los paths van desde ahí
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      - cowrie_downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      - cowrie_tty:/cowrie/cowrie-git/var/lib/cowrie/tty
    healthcheck:
      # La imagen no tiene /bin/sh ni nc, pero sí python3 en el virtualenv
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 2222)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - COWRIE_TELNET_ENABLED=yes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Dionaea multiprotocolo — SMB, HTTP, FTP, MySQL, MSSQL, SIP
  dionaea:
    build:
      context: ./dionaea
      dockerfile: Dockerfile
    container_name: dionaea
    hostname: dionaea-sensor
    restart: unless-stopped
    networks:
      - honeypot_net
    ports:
      - "0.0.0.0:21:21/tcp"      # FTP
      - "0.0.0.0:80:80/tcp"      # HTTP
      - "0.0.0.0:443:443/tcp"    # HTTPS
      - "0.0.0.0:445:445/tcp"    # SMB
      - "0.0.0.0:135:135/tcp"    # MSRPC
      - "0.0.0.0:1433:1433/tcp"  # MSSQL
      - "0.0.0.0:3306:3306/tcp"  # MySQL
      - "0.0.0.0:5060:5060/tcp"  # SIP TCP
      - "0.0.0.0:5060:5060/udp"  # SIP UDP
    volumes:
      # Montar /opt/dionaea/var/ completo: init_lib/init_log del entrypoint necesitan
      # encontrar el directorio vacío para crear la estructura con ownership dionaea:dionaea
      - dionaea_var:/opt/dionaea/var
    healthcheck:
      # nc no está en la imagen; bash /dev/tcp no necesita binario externo
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80' && bash -c '</dev/tcp/127.0.0.1/445'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # cap_drop:ALL no va con Dionaea: el entrypoint necesita escribir dirs con ownership dionaea:dionaea
    # La imagen es de 2020 y asume caps de root. El egress está bloqueado por iptables DOCKER-USER.
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# Red bridge interna para los honeypots.
# inbound habilitado (recibe ataques desde internet), egress bloqueado via iptables DOCKER-USER (02_firewall.sh)
networks:
  honeypot_net:
    name: honeypot_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: br-honeypot
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

# IMPORTANTE: estos volúmenes pueden contener malware capturado, no subir al repo
volumes:
  cowrie_logs:
    name: honeypots_cowrie_logs
  cowrie_downloads:
    name: honeypots_cowrie_downloads
  cowrie_tty:
    name: honeypots_cowrie_tty
  dionaea_var:
    name: honeypots_dionaea_var
