# Turn on Dionaea's structured JSON output (one event per line) for the ECS pipeline.
# The Dockerfile copies this file to ihandlers-enabled/ in the image template.
# Output: /opt/dionaea/var/lib/dionaea/dionaea.json  (Filebeat tails it).
# NOTE: pure ASCII required; Dionaea's YAML reader uses the ascii codec and dies on accents.
- name: log_json
  config:
    # flat_data flattens object lists so they index cleanly in Elasticsearch/ELK.
    flat_data: true
    # ABSOLUTE path with file:// + 3 slashes: with two slashes urlparse reads the first segment
    # as a host and the file never gets created.
    handlers:
      - file:///opt/dionaea/var/lib/dionaea/dionaea.json
