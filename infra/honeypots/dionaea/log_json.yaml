# Enciende la salida JSON estructurada de Dionaea, un objeto por evento, para el pipeline ECS.
# El Dockerfile copia este archivo a ihandlers-enabled/ en la plantilla de la imagen, y lo que
# escribe, /opt/dionaea/var/lib/dionaea/dionaea.json, es el archivo que sigue Filebeat.
# Va en ASCII puro, porque el lector YAML de Dionaea usa el codec ascii y se cae con un acento.
- name: log_json
  config:
    # flat_data aplana las listas de objetos para que indexen limpio en Elasticsearch.
    flat_data: true
    # La ruta va absoluta, con file:// y tres barras: con dos, urlparse lee el primer segmento
    # como si fuera un host y el archivo nunca se crea.
    handlers:
      - file:///opt/dionaea/var/lib/dionaea/dionaea.json
