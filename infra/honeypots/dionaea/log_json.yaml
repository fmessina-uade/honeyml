# Habilita la salida estructurada JSON de Dionaea (un evento por linea) para el pipeline ECS.
# El Dockerfile copia este archivo a ihandlers-enabled/ del template de la imagen.
# Salida: /opt/dionaea/var/lib/dionaea/dionaea.json  (Filebeat lo tail-ea).
# NOTA: ASCII puro obligatorio; el lector YAML de Dionaea usa codec ascii y falla con acentos.
- name: log_json
  config:
    # flat_data aplana listas de objetos para que indexen bien en Elasticsearch/ELK.
    flat_data: true
    # Path ABSOLUTO con file:// + 3 barras: con dos barras, urlparse interpreta el primer
    # segmento como host y el archivo no se crea.
    handlers:
      - file:///opt/dionaea/var/lib/dionaea/dionaea.json
