# dionaea.cfg — REFERENCIA DOCUMENTAL (no montado actualmente)
#
# La imagen dinotools/dionaea usa un sistema de configuración basado en archivos
# YAML individuales por servicio, ubicados en:
#   /etc/dionaea/services-enabled/   — servicios de red activos
#   /etc/dionaea/ihandlers-enabled/  — handlers de eventos (logging, store, etc.)
#
# Para personalizar un servicio en producción, montar el YAML específico:
#   - ./dionaea/services-enabled/smb.yaml:/etc/dionaea/services-enabled/smb.yaml:ro
#
# Los archivos YAML de ejemplo se encuentran en el contenedor en:
#   /etc/dionaea/services-available/
#   /etc/dionaea/ihandlers-available/
#
# Para extraer la configuración por defecto del contenedor y usarla como base:
#   docker run --rm dinotools/dionaea cat /etc/dionaea/services-available/smb.yaml
#
# Servicios habilitados por defecto en la imagen:
#   blackhole, epmap, ftp, http, memcache, mirror, mongo, mqtt,
#   mssql, mysql, pptp, printer, sip, smb, tftp, upnp
#
