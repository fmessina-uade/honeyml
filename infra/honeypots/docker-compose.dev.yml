# Ajustes para desarrollo local en macOS o Linux, que se suman a la composición de producción. Se
# levanta con `make dev-up`, o con docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Los puertos cambian porque en la máquina de desarrollo los reales suelen estar ocupados: macOS corre
# su propio sshd en el 22 y comparte archivos por SMB en el 445, y puede haber un MySQL en el 3306 o
# un servidor web en el 80.

services:
  cowrie:
    ports:
      - "127.0.0.1:2222:2222/tcp"   # honeypot SSH  (se prueba con: ssh -p 2222 root@localhost)
      - "127.0.0.1:2323:2223/tcp"   # Telnet honeypot
    # sin tope de CPU en local, para que no moleste mientras se desarrolla
    cpus: "1.0"
    mem_limit: 256m

  dionaea:
    ports:
      - "127.0.0.1:2121:21/tcp"     # FTP
      - "127.0.0.1:8080:80/tcp"     # HTTP  (se prueba con: curl http://localhost:8080)
      - "127.0.0.1:8443:443/tcp"    # HTTPS
      - "127.0.0.1:4445:445/tcp"    # SMB
      - "127.0.0.1:1350:135/tcp"    # MSRPC
      - "127.0.0.1:14330:1433/tcp"  # MSSQL
      - "127.0.0.1:13306:3306/tcp"  # MySQL
    mem_limit: 512m
