# docker-compose.dev.yml: override for local dev (macOS/Linux)
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#        or just: make dev-up
#
# Why the ports change:
#   Port 22   -> macOS runs its own sshd on 22
#   Port 445  -> macOS has native SMB (File Sharing)
#   Port 3306 -> a local MySQL may be running
#   Port 80   -> there may be a local web server

services:
  cowrie:
    ports:
      - "127.0.0.1:2222:2222/tcp"   # SSH honeypot  (test with: ssh -p 2222 root@localhost)
      - "127.0.0.1:2323:2223/tcp"   # Telnet honeypot
    # no CPU cap locally so it doesn't get in the way of dev
    cpus: "1.0"
    mem_limit: 256m

  dionaea:
    ports:
      - "127.0.0.1:2121:21/tcp"     # FTP
      - "127.0.0.1:8080:80/tcp"     # HTTP  (test with: curl http://localhost:8080)
      - "127.0.0.1:8443:443/tcp"    # HTTPS
      - "127.0.0.1:4445:445/tcp"    # SMB
      - "127.0.0.1:1350:135/tcp"    # MSRPC
      - "127.0.0.1:14330:1433/tcp"  # MSSQL
      - "127.0.0.1:13306:3306/tcp"  # MySQL
      - "127.0.0.1:15060:5060/tcp"  # SIP TCP
      - "127.0.0.1:15060:5060/udp"  # SIP UDP
    mem_limit: 512m
