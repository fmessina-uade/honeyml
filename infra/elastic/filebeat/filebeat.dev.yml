# Filebeat, desarrollo local. Lee datos reales bajados del VPS (data/logs/, montado en /logs).
# Reprocesa archivos históricos completos, así podemos iterar la normalización ECS.

filebeat.inputs:
  - type: filestream
    id: cowrie-json-dev
    enabled: true
    paths:
      - /logs/cowrie/cowrie.json
      - /logs/cowrie/cowrie.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: cowrie
    # en desarrollo queremos leer los archivos históricos desde el principio
    ignore_older: 0
    prospector.scanner.check_interval: 5s
    # Los archivos se reconocen por el contenido de su primer kilobyte y no por el inodo. Los inodos
    # que ve el contenedor dentro de este montaje no son estables: rsync los cambia cada vez que
    # reemplaza un archivo, y algunos arranques del stack cambian también los de archivos sin tocar.
    # Con la identidad por inodo, Filebeat toma cada cambio como un archivo nuevo, lo relee desde el
    # principio y el bus recibe otra vez eventos ya decididos.
    # Con la huella, un archivo rotado que llega con otro nombre se reconoce y se sigue desde donde
    # había quedado. Cambiar la identidad provoca una relectura completa, por única vez.
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~

  # Dionaea (una muestra real bajada del contenedor) para validar la normalización ECS.
  - type: filestream
    id: dionaea-json-dev
    enabled: true
    paths:
      - /logs/dionaea/dionaea.json
      # logrotate rota este archivo a diario; ver la nota en filebeat.yml
      - /logs/dionaea/dionaea.json.[0-9]*
    exclude_files: ['\.gz$']
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: dionaea
    ignore_older: 0
    # misma identidad por contenido que Cowrie, por el mismo motivo
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false
setup.ilm.enabled: false
setup.template.enabled: false
