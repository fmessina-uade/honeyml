# Filebeat — desarrollo local. Lee datos reales bajados del VPS (data/logs/ -> /logs).
# Reprocesa archivos históricos completos para iterar la normalización ECS.

filebeat.inputs:
  - type: filestream
    id: cowrie-json-dev
    enabled: true
    paths:
      - /logs/cowrie/cowrie.json
      - /logs/cowrie/cowrie.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: cowrie
    # En dev queremos leer archivos históricos desde el principio.
    ignore_older: 0
    prospector.scanner.check_interval: 5s

  # Dionaea (muestra real bajada del contenedor) para validar la normalización ECS.
  - type: filestream
    id: dionaea-json-dev
    enabled: true
    paths:
      - /logs/dionaea/dionaea.json
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: dionaea
    ignore_older: 0

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false
setup.ilm.enabled: false
setup.template.enabled: false
