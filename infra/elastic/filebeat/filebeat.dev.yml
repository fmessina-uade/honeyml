# Filebeat, local dev. Reads real data pulled from the VPS (data/logs/ -> /logs).
# Reprocesses whole historical files so we can iterate the ECS normalization.

filebeat.inputs:
  - type: filestream
    id: cowrie-json-dev
    enabled: true
    paths:
      - /logs/cowrie/cowrie.json
      - /logs/cowrie/cowrie.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: cowrie
    # in dev we want to read historical files from the start
    ignore_older: 0
    prospector.scanner.check_interval: 5s

  # Dionaea (a real sample pulled from the container) to validate the ECS normalization.
  - type: filestream
    id: dionaea-json-dev
    enabled: true
    paths:
      - /logs/dionaea/dionaea.json
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: dionaea
    ignore_older: 0

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false
setup.ilm.enabled: false
setup.template.enabled: false
