# Filebeat, producción. Sigue los registros JSON de los honeypots y los manda a Logstash.
# Los volúmenes de los honeypots se montan de solo lectura (ver docker-compose.yml).

filebeat.inputs:
  # Honeypot Cowrie de SSH y Telnet. Su salida jsonlog escribe un evento por línea.
  - type: filestream
    id: cowrie-json
    enabled: true
    paths:
      - /logs/cowrie/cowrie.json
      - /logs/cowrie/cowrie.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: cowrie
    # Identidad por el contenido del primer kilobyte y no por inodo. Filebeat relee como nuevo todo
    # lo que cambia de inodo, y el inodo no es estable: en desarrollo rsync lo cambia al reemplazar
    # un archivo, y Elastic documenta que Docker puede reutilizar inodos. Dejar las dos
    # configuraciones iguales evita la sorpresa el día que el stack corra en el VPS.
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~

  # Dionaea, multiprotocolo. El ihandler log_json viene cocinado en la imagen (Dockerfile).
  # Si el archivo todavía no existe, esta entrada simplemente no encuentra nada, no falla.
  - type: filestream
    id: dionaea-json
    enabled: true
    paths:
      # el volumen honeypots_dionaea_var (=/opt/dionaea/var) se monta en /logs/dionaea.
      # log_json escribe en var/lib/dionaea/dionaea.json, que acá se ve en /logs/dionaea/lib/dionaea/dionaea.json
      - /logs/dionaea/lib/dionaea/dionaea.json
      # logrotate rota este archivo cuando pasa los 100 MB (ver /etc/logrotate.d/dionaea). Con
      # delaycompress, la rotación más reciente queda sin comprimir hasta la siguiente, que es la
      # ventana en la que filestream todavía la puede leer. Las comprimidas se excluyen abajo porque
      # filestream no sabe descomprimir.
      - /logs/dionaea/lib/dionaea/dionaea.json.[0-9]*
    # Con el prefijo del prospector. Un exclude_files suelto es la opción de la entrada vieja:
    # filestream lo ignora sin avisar y lee el comprimido como texto, una línea por cada byte de
    # salto de línea que aparezca en el gzip.
    prospector.scanner.exclude_files: ['\.gz$']
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: dionaea
    # misma identidad por contenido que Cowrie, por el mismo motivo
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~

# Filebeat solo transporta; la normalización ECS ocurre en Logstash.
output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false

# sin configuración automática de índices ni tableros: el mapeo lo manejan Logstash y la plantilla.
setup.ilm.enabled: false
setup.template.enabled: false
