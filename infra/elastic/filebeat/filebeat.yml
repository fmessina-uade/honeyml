# Filebeat, production. Tails the honeypots' JSON logs into Logstash.
# The honeypot volumes are mounted read-only (see docker-compose.yml).

filebeat.inputs:
  # Cowrie SSH/Telnet honeypot. Its jsonlog output writes one event per line.
  - type: filestream
    id: cowrie-json
    enabled: true
    paths:
      - /logs/cowrie/cowrie.json
      - /logs/cowrie/cowrie.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: cowrie

  # Dionaea, multiprotocol. The log_json ihandler is baked into the image (Dockerfile).
  # If the file doesn't exist yet, this input just finds nothing (no failure).
  - type: filestream
    id: dionaea-json
    enabled: true
    paths:
      # the honeypots_dionaea_var volume (=/opt/dionaea/var) is mounted at /logs/dionaea.
      # log_json writes to var/lib/dionaea/dionaea.json -> /logs/dionaea/lib/dionaea/dionaea.json
      - /logs/dionaea/lib/dionaea/dionaea.json
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: dionaea

# Filebeat only ships; the ECS normalization happens in Logstash.
output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false

# no auto index/dashboard setup: Logstash + the template own the mapping.
setup.ilm.enabled: false
setup.template.enabled: false
