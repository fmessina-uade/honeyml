# Filebeat, producción. Sigue los registros JSON de los honeypots y los manda a Logstash.
# Los volúmenes de los honeypots se montan de solo lectura (ver docker-compose.yml).

filebeat.inputs:
  # Honeypot Cowrie de SSH y Telnet. Su salida jsonlog escribe un evento por línea.
  - type: filestream
    id: cowrie-json
    enabled: true
    paths:
      - /logs/cowrie/cowrie.json
      - /logs/cowrie/cowrie.json.*
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: cowrie

  # Dionaea, multiprotocolo. El ihandler log_json viene cocinado en la imagen (Dockerfile).
  # Si el archivo todavía no existe, esta entrada simplemente no encuentra nada, no falla.
  - type: filestream
    id: dionaea-json
    enabled: true
    paths:
      # el volumen honeypots_dionaea_var (=/opt/dionaea/var) se monta en /logs/dionaea.
      # log_json escribe en var/lib/dionaea/dionaea.json -> /logs/dionaea/lib/dionaea/dionaea.json
      - /logs/dionaea/lib/dionaea/dionaea.json
      # logrotate rota este archivo a diario (ver /etc/logrotate.d/dionaea). Con delaycompress, la
      # rotación más reciente queda sin comprimir durante un ciclo, que es la ventana en la que
      # filestream todavía la puede leer. Las comprimidas se excluyen abajo porque filestream no
      # sabe descomprimir.
      - /logs/dionaea/lib/dionaea/dionaea.json.[0-9]*
    exclude_files: ['\.gz$']
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields_under_root: true
    fields:
      honeypot: dionaea

# Filebeat solo transporta; la normalización ECS ocurre en Logstash.
output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false

# sin configuración automática de índices ni tableros: el mapeo lo manejan Logstash y la plantilla.
setup.ilm.enabled: false
setup.template.enabled: false
