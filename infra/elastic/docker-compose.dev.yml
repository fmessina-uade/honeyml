# Local dev override.
#
# Differences from prod:
#   - smaller heaps so it runs on the Mac alongside other stuff.
#   - Filebeat does NOT read the honeypot volumes: it reads a local dir (data/logs/) with real
#     data pulled from the VPS, so we can iterate the ECS normalization without honeypot
#     containers running locally.
#
# Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#         (or `make elastic-dev-up` from the repo root)

services:

  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
    mem_limit: 1500m

  logstash:
    environment:
      - "LS_JAVA_OPTS=-Xmx512m -Xms256m"
    mem_limit: 768m

  kibana:
    mem_limit: 900m

  filebeat:
    depends_on:
      logstash:
        condition: service_healthy
    # !override replaces the base volume list instead of merging it, so in dev we skip the
    # external honeypot volumes (which may not exist locally).
    volumes: !override
      - ./filebeat/filebeat.dev.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
      # real data pulled from the VPS (make pull-logs). Stands in for the honeypot volumes.
      - ../../data/logs:/logs:ro
