# Override para desarrollo local.
#
# Diferencias con producción:
#   - heaps más chicos, así corre en la Mac junto con todo lo demás.
#   - Filebeat NO lee los volúmenes de los honeypots: lee un directorio local (data/logs/) con
#     datos reales bajados del VPS, así podemos iterar la normalización ECS sin honeypot
#     contenedores corriendo en la máquina local.
#
# Uso:    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#         (o `make elastic-dev-up` desde la raíz del repositorio)

services:

  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
    mem_limit: 1500m

  logstash:
    environment:
      - "LS_JAVA_OPTS=-Xmx512m -Xms256m"
    # Estaba en 768m y quedaba demasiado justo: con el heap en 512m, lo que Logstash usa fuera
    # del heap lo dejaba en 749m aun quieto, y el 15/09, en medio de una relectura del corpus, el
    # proceso murió sin dejar volcado ni error. Con 1g aguantó una ingesta de 300.000 eventos,
    # pero terminó con 891m de memoria anónima, que no es caché y no se libera: le quedaban unos
    # 130m. Con 1536m el margen pasa del medio giga. Queda igual que en producción.
    mem_limit: 1536m

  kibana:
    mem_limit: 900m

  filebeat:
    depends_on:
      logstash:
        condition: service_healthy
    # !override reemplaza la lista de volúmenes base en vez de fusionarla, así en desarrollo nos
    # salteamos los volúmenes externos de los honeypots, que localmente pueden no existir.
    volumes: !override
      # Después de editar este archivo conviene recrear el contenedor (docker compose up -d
      # --force-recreate --no-deps filebeat): no está verificado que un reinicio simple lo refresque.
      # El 15/09, tras una edición, el contenedor lo seguía viendo con el tamaño anterior, leía el
      # contenido nuevo cortado y le faltaba la sección de salida, con la que Filebeat no arranca.
      - ./filebeat/filebeat.dev.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
      # datos reales bajados del VPS (make pull-logs). Hacen las veces de los volúmenes.
      - ../../data/logs:/logs:ro
