# Ajustes para desarrollo local, que se suman a la composición de producción.
#
# En la Mac los heaps van más chicos, para que el stack corra junto con todo lo demás. Y Filebeat no
# lee los volúmenes de los honeypots sino data/logs/, con datos reales bajados del VPS, así la
# normalización ECS se puede iterar sin sensores corriendo en la máquina local.
#
# Se levanta con `make elastic-dev-up` desde la raíz del repositorio, o con
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:

  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
    mem_limit: 1500m

  logstash:
    environment:
      - "LS_JAVA_OPTS=-Xmx512m -Xms256m"
    # Con el heap en 512m, lo que Logstash usa fuera del heap lo deja cerca de los 750m aun quieto,
    # y durante una relectura del corpus la memoria anónima, que no es caché y no se libera, pasa
    # los 850m. Un tope de 768m o de 1g lo deja sin margen; con 1536m el margen pasa del medio giga.
    # Queda igual que en producción.
    mem_limit: 1536m

  filebeat:
    depends_on:
      logstash:
        condition: service_healthy
    # !override reemplaza la lista de volúmenes base en vez de fusionarla, así en desarrollo nos
    # salteamos los volúmenes externos de los honeypots, que localmente pueden no existir.
    volumes: !override
      # Después de editar este archivo conviene recrear el contenedor (docker compose up -d
      # --force-recreate --no-deps filebeat). Un archivo suelto montado puede seguir viéndose con el
      # tamaño anterior: Filebeat lee el contenido nuevo cortado, sin la sección de salida, y no
      # arranca.
      - ./filebeat/filebeat.dev.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
      # datos reales bajados del VPS (make pull-logs). Hacen las veces de los volúmenes.
      - ../../data/logs:/logs:ro
