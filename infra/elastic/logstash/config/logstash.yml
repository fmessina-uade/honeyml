http.host: "0.0.0.0"
# El pipeline principal vive en los archivos bajo /usr/share/logstash/pipeline.
pipeline.ordered: auto
log.level: info

# Bases geográficas. La edición abierta no trae el gestor que descarga bases desde el servicio de
# Elastic, así que el filtro geoip usa las que vienen empaquetadas con el plugin: GeoLite2-City y
# GeoLite2-ASN, de MaxMind, bajo licencia Creative Commons Atribución-CompartirIgual 4.0. No caducan
# ni dependen de ningún servicio externo. Son las últimas que MaxMind publicó con esa licencia, así
# que no se actualizan: a nivel país y organización sirven para agrupar y comparar, y a nivel ciudad
# son aproximadas.

# Cola persistente entre la entrada y el resto del pipeline.
#
# Con la cola en memoria, los eventos que Logstash ya aceptó del transportador pero todavía no
# escribió en el índice viven solo en la RAM del proceso, y un reinicio, un corte de energía o un
# fin por memoria se los lleva. En un honeypot eso no se recupera: el ataque ocurrió una vez y no se
# repite. Con la cola persistida, la entrada confirma la recepción recién cuando el evento está
# escrito en disco, y al reiniciar el pipeline retoma desde el último punto de control.
#
# La cola vive en path.data, que en la composición está montado sobre un volumen con nombre. Sin ese
# volumen quedaría en la capa efímera del contenedor y se perdería en cada recreación.
queue.type: persisted

# El tope cubre varios días de actividad intensa con el índice caído. El espacio se reserva de a
# páginas a medida que hace falta, así que en operación normal la cola está casi vacía: que sobre no
# cuesta nada y que falte cuesta eventos.
queue.max_bytes: 2gb

# El punto de control se sincroniza a disco cada 128 escrituras en lugar de las 1024 por defecto.
# Con el caudal de este sistema, el valor por defecto deja ventanas largas sin sincronizar; a 128 la
# ventana queda por debajo del minuto aun en los picos, por el costo de una sincronización cada
# tanto.
#
# Lo que hay dentro de esa ventana no se pierde: se vuelve a entregar al reiniciar. Como el
# identificador del documento es determinista, reindexar lo mismo no genera duplicados. Sí llegan
# repetidos al bus, que entrega al menos una vez por diseño, y por eso su consumidor es idempotente.
queue.checkpoint.writes: 128
