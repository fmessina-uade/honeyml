# Normaliza los eventos de Dionaea a ECS.
#
# Con flat_data: true, log_json escribe un esquema plano, con src_ip y dst_ip en la raíz y sin
# anidar. La conexión trae protocol (httpd, smbd, ftpd, mysqld, mssqld y otros), transport y type
# (accept, connect o reject); los accesos traen además credentials, con listas de usuarios y
# contraseñas, y cada protocolo agrega sus propios campos bajo su nombre, como ftp.

filter {
  if [honeypot] == "dionaea" {

    # Una línea que Filebeat no pudo leer como JSON no es un evento de Dionaea, que escribe un objeto
    # por línea: sale de un archivo que no correspondía leer, como un rotado comprimido. Sin esto
    # llega al índice sin ningún campo del sensor y con la hora de lectura en vez de la de captura.
    # Las descartadas se cuentan en las estadísticas del nodo, por el id del filtro.
    if [error][type] == "json" {
      drop { id => "descartar_linea_no_json_dionaea" }
    }

    mutate {
      remove_field => ["[ecs]", "[agent]", "[host]", "[input]", "[log]", "[@version]"]
    }

    # marca temporal ISO 8601 sin sufijo de zona; Dionaea la emite sin la Z
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure_dionaea"]
    }

    mutate {
      add_field => {
        "[ecs][version]"      => "8.11.0"
        "[event][module]"     => "dionaea"
        "[event][kind]"       => "event"
        "[event][provider]"   => "dionaea"
        "[event][category]"   => "network"
        "[observer][type]"    => "honeypot"
        "[observer][vendor]"  => "dionaea"
        "[observer][name]"    => "dionaea-sensor"
      }
    }

    # la terna de red (esquema plano, igual que en Cowrie)
    if [src_ip]   { mutate { rename => { "src_ip"   => "[source][ip]" } } }
    if [src_port] { mutate { rename => { "src_port" => "[source][port]" } } }
    if [dst_ip]   { mutate { rename => { "dst_ip"   => "[destination][ip]" } } }
    if [dst_port] { mutate { rename => { "dst_port" => "[destination][port]" } } }
    if [src_hostname] and [src_hostname] != "" {
      mutate { rename => { "src_hostname" => "[source][domain]" } }
    } else {
      mutate { remove_field => ["src_hostname"] }
    }

    # connection.{protocol,transport,type}
    if [connection][protocol]  { mutate { rename => { "[connection][protocol]"  => "[network][protocol]" } } }
    if [connection][transport] { mutate { rename => { "[connection][transport]" => "[network][transport]" } } }
    if [connection][type] {
      mutate {
        add_field => {
          "[event][action]" => "connection-%{[connection][type]}"
          "[event][type]"   => "connection"
        }
      }
      # reject significa intento rechazado
      if [connection][type] == "reject" {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      }
      mutate { rename => { "[connection][type]" => "[dionaea][connection_type]" } }
    }
    mutate { remove_field => ["connection"] }

    # event.dataset a partir del protocolo del servicio (httpd, smbd y los demás)
    if [network][protocol] {
      mutate { add_field => { "[event][dataset]" => "dionaea.%{[network][protocol]}" } }
    }

    # credenciales (flat_data las deja como listas); si están, además es un evento de autenticación
    if [credentials] {
      # replace y no add_field: la categoría base ya vale "network", y agregar sobre un campo
      # existente lo convierte en lista. ECS admite la lista, pero Cowrie emite un valor único, y
      # esa asimetría cuesta dos cosas: la comparación == de Logstash deja de dar verdadero, con lo
      # que el evento nunca llega al bus, y el reparto por categoría lo cuenta dos veces.
      mutate { replace => { "[event][category]" => "authentication" } }
      # La acción no puede quedar en "connection-accept", porque lo que describe el evento es la
      # presentación de credenciales. Se usa un verbo propio y deliberadamente distinto de "login",
      # que es el de Cowrie: allá el resultado lo declara el sensor y acá se infiere. Mantenerlos
      # separados evita que los contadores del panel sumen dos cosas que no se midieron igual.
      mutate { replace => { "[event][action]" => "credential-attempt" } }
      # flat_data envuelve cada valor en una lista de un elemento. Se desenvuelve porque un usuario
      # es un dato suelto, y dejarlo como lista se filtra hasta el mensaje del bus, donde el motor
      # recibiría ["root"] en lugar de root. Cada evento trae un solo usuario y una sola contraseña,
      # así que tomar el primero no pierde nada.
      if [credentials][username] {
        mutate { add_field => { "[user][name]" => "%{[credentials][username][0]}" } }
      }
      if [credentials][password] {
        mutate { add_field => { "[dionaea][password]" => "%{[credentials][password][0]}" } }
      }
      mutate { remove_field => ["credentials"] }
    }

    # los campos por protocolo quedan bajo nuestro propio espacio de nombres
    if [ftp]      { mutate { rename => { "[ftp]"      => "[dionaea][ftp]" } } }
    if [mysql]    { mutate { rename => { "[mysql]"    => "[dionaea][mysql]" } } }
    if [mssql]    { mutate { rename => { "[mssql]"    => "[dionaea][mssql]" } } }
    if [smb]      { mutate { rename => { "[smb]"      => "[dionaea][smb]" } } }
    if [virustotal] { mutate { rename => { "[virustotal]" => "[dionaea][virustotal]" } } }

    # Dionaea no declara si la credencial fue aceptada: emula el servicio y sigue la conversación,
    # pero el protocolo deja evidencia. En FTP, los comandos PWD, CWD, PASV, TYPE, LIST, RETR y
    # STOR solo se responden con una sesión autenticada; un servidor que rechazó el acceso contesta
    # 530 y no llega ahí. Que aparezcan después de PASS prueba que el acceso prosperó.
    #
    # MySQL y MSSQL no registran actividad posterior en el log, así que no hay nada que inferir y el
    # resultado queda en "unknown": un desconocido honesto vale más que un éxito sin respaldo.
    if [event][category] == "authentication" {
      if "PWD"  in [dionaea][ftp][commands][command]
         or "CWD"  in [dionaea][ftp][commands][command]
         or "PASV" in [dionaea][ftp][commands][command]
         or "EPSV" in [dionaea][ftp][commands][command]
         or "TYPE" in [dionaea][ftp][commands][command]
         or "LIST" in [dionaea][ftp][commands][command]
         or "NLST" in [dionaea][ftp][commands][command]
         or "RETR" in [dionaea][ftp][commands][command]
         or "STOR" in [dionaea][ftp][commands][command]
         or "SIZE" in [dionaea][ftp][commands][command] {
        mutate { replace => { "[event][outcome]" => "success" } }
      }
    }

    if ![event][outcome] {
      mutate { add_field => { "[event][outcome]" => "unknown" } }
    }

    # related.ip
    if [source][ip]      { mutate { add_field => { "[related][ip]" => "%{[source][ip]}" } } }
    if [destination][ip] { mutate { add_field => { "[related][ip]" => "%{[destination][ip]}" } } }

    mutate { remove_field => ["timestamp"] }

    fingerprint {
      source => ["[network][protocol]", "[source][ip]", "[source][port]",
                 "[destination][port]", "@timestamp"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][doc_id]"
    }
  }
}
