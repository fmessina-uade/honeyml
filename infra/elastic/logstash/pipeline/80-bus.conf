# Publicación al bus de eventos en tiempo real (los streams de Valkey), para el motor de triaje.
#
# Se hace desde un filtro ubicado antes de la salida porque logstash-output-redis solo admite
# `list` y `channel`, y los grupos de consumidores con acuse explícito, que evitan perder un evento
# tomado por un agente caído, son propios de los streams. El filtro usa la gema redis que trae la
# imagen, que sirve tal cual porque Valkey habla el mismo protocolo.
#
# Casi todo el volumen es reconocimiento (conexiones que se abren y cierran, negociación de
# protocolo) o intentos de acceso fallidos, y mandarlo a inferencia cuesta dinero sin producir
# inteligencia. Al bus pasan los eventos donde el atacante hizo algo: autenticaciones exitosas,
# comandos, transferencias de archivos e intentos de credenciales contra Dionaea, prosperen o no.
# Estos últimos van todos porque Dionaea solo declara el resultado en FTP, y en MySQL y MSSQL queda
# en "unknown". A diferencia de SSH, que recibe fuerza bruta indiscriminada de todo internet, nadie
# prueba credenciales contra el 3306 de paso, así que el intento ya es la señal y el volumen que
# suma es despreciable.
#
# Filtrar el bus no pierde información: el nodo de enriquecimiento del agente consulta el índice,
# que conserva toda la telemetría. Lo que no se publica sigue disponible como contexto histórico,
# aunque no dispara un ciclo de razonamiento por sí mismo.

filter {

  # Marca de interés, evaluada sobre el esquema común ya normalizado.
  #
  # Va en una sola condición a propósito: con dos bloques separados, un evento que cumpliera ambas
  # recibiría la marca dos veces y el campo pasaría a ser una lista, con lo que la comparación de
  # abajo dejaría de dar verdadero y el evento no se publicaría nunca.
  if ([event][category] == "authentication" and [event][outcome] == "success")
     or ([event][category] == "authentication" and [honeypot] == "dionaea")
     or [event][category] == "process"
     or [event][category] == "file" {
    mutate { add_field => { "[@metadata][to_bus]" => "true" } }
  }

  if [@metadata][to_bus] == "true" {
    ruby {
      id => "publicar_al_bus"

      init => '
        require "redis"
        require "json"
        @bus_host   = ENV.fetch("BUS_HOST", "valkey")
        @bus_port   = ENV.fetch("BUS_PORT", "6379").to_i
        @bus_stream = ENV.fetch("BUS_STREAM", "honeyml:events")
        # Vacía quiere decir sin autenticación, como en una prueba local; en el servidor la fija el
        # entorno. Va nil en lugar de "" para que el cliente no mande un AUTH con clave vacía.
        bus_pass    = ENV["BUS_PASSWORD"]
        @bus_pass   = (bus_pass.nil? || bus_pass.empty?) ? nil : bus_pass
        # El stream lleva tope porque el motor consume en línea y no necesita historia profunda, y
        # el índice ya es la fuente de verdad. El recorte aproximado (el ~ de XADD) es mucho más
        # barato que el exacto.
        @bus_maxlen = ENV.fetch("BUS_MAXLEN", "100000").to_i
        @bus = nil
      '

      code => '
        begin
          @bus ||= Redis.new(host: @bus_host, port: @bus_port, password: @bus_pass, timeout: 2)

          # Solo lo que el motor necesita para razonar. El resto lo recupera del índice por
          # identificador, así el mensaje se mantiene chico y no duplica el almacenamiento.
          payload = {
            "doc_id"    => event.get("[@metadata][doc_id]").to_s,
            "timestamp" => event.get("@timestamp").to_s,
            "honeypot"  => event.get("[honeypot]").to_s,
            "category"  => event.get("[event][category]").to_s,
            "action"    => event.get("[event][action]").to_s,
            "outcome"   => event.get("[event][outcome]").to_s,
            "protocol"  => event.get("[network][protocol]").to_s,
            "source_ip" => event.get("[source][ip]").to_s,
            "session"   => event.get("[cowrie][session]").to_s,
            "user"      => event.get("[user][name]").to_s,
            "command"   => event.get("[process][command_line]").to_s,
          }

          @bus.xadd(@bus_stream, payload, maxlen: @bus_maxlen, approximate: true)
        rescue => e
          # El bus es secundario frente a la persistencia: si falla, el evento igual se indexa.
          # Se marca para que la ausencia quede visible en lugar de silenciosa.
          event.tag("_bus_publish_failed")
          event.set("[@metadata][bus_error]", e.class.to_s)
          @bus = nil
        end
      '
    }
  }
}
