# Publicación al bus de eventos en tiempo real (los streams de Valkey), para el motor de triaje.
#
# Un filtro y no una salida: el plugin logstash-output-redis solo admite `list` y `channel`; no habla el protocolo de
# streams. Y streams es lo que da grupos de consumidores y acuse explícito, que es lo que
# garantiza que un evento tomado por un agente caído no se pierda. Por eso la
# publicación se hace con la gema redis, que viene incluida en la imagen, desde un filtro
# ubicado antes de la salida. La gema sirve tal cual porque Valkey habla el mismo protocolo.
#
# Qué se publica. No todo. La gran mayoría del volumen es reconocimiento (conexiones que se abren y
# cierran, negociación de protocolo), y casi todo el resto son intentos de acceso fallidos. Someter
# eso a un servicio de inferencia no produce inteligencia y cuesta dinero.
#
# Se publican los eventos donde el atacante efectivamente hizo algo:
#   - autenticaciones exitosas: alguien entró
#   - ejecución de comandos: qué hizo una vez adentro
#   - transferencia de archivos: qué trajo o se llevó
#   - intentos de credenciales contra Dionaea, prosperen o no
#
# La última merece explicación. Dionaea solo puede declarar el resultado en FTP, donde el protocolo
# deja rastro; en MySQL y MSSQL queda en "unknown" y nunca satisfaría la condición de éxito. Pero un
# intento de acceso contra un motor de base de datos expuesto ya es la señal: a diferencia de SSH,
# que recibe fuerza bruta indiscriminada de todo internet, nadie prueba credenciales contra el 3306
# de paso, y el volumen que agrega es despreciable.
#
# En conjunto, lo publicado es una fracción chica del volumen total.
#
# Filtrar el bus no pierde información: el nodo de enriquecimiento del agente consulta el índice,
# que conserva la totalidad de la telemetría. Lo que no se publica sigue disponible como contexto
# histórico; solo que no dispara un ciclo de razonamiento por sí mismo.

filter {

  # Marca de interés, evaluada sobre el esquema común ya normalizado.
  #
  # Va en una sola condición a propósito: con dos bloques separados, un evento que cumpliera ambas
  # recibiría la marca dos veces y el campo pasaría a ser una lista, con lo que la comparación de
  # abajo dejaría de dar verdadero y el evento no se publicaría nunca.
  if ([event][category] == "authentication" and [event][outcome] == "success")
     or ([event][category] == "authentication" and [honeypot] == "dionaea")
     or [event][category] == "process"
     or [event][category] == "file" {
    mutate { add_field => { "[@metadata][to_bus]" => "true" } }
  }

  if [@metadata][to_bus] == "true" {
    ruby {
      id => "publicar_al_bus"

      init => '
        require "redis"
        require "json"
        @bus_host   = ENV.fetch("BUS_HOST", "valkey")
        @bus_port   = ENV.fetch("BUS_PORT", "6379").to_i
        @bus_stream = ENV.fetch("BUS_STREAM", "honeyml:events")
        # tope del stream: el motor consume en línea, no necesita historia profunda, y el índice
        # ya es la fuente de verdad. El ~ deja que el bus recorte de forma aproximada, que es
        # mucho más barato que exacto.
        @bus_maxlen = ENV.fetch("BUS_MAXLEN", "100000").to_i
        @bus = nil
      '

      code => '
        begin
          @bus ||= Redis.new(host: @bus_host, port: @bus_port, timeout: 2)

          # Solo lo que el motor necesita para razonar. El resto lo recupera del índice por
          # identificador, así el mensaje se mantiene chico y no duplica el almacenamiento.
          payload = {
            "doc_id"    => event.get("[@metadata][doc_id]").to_s,
            "timestamp" => event.get("@timestamp").to_s,
            "honeypot"  => event.get("[honeypot]").to_s,
            "category"  => event.get("[event][category]").to_s,
            "action"    => event.get("[event][action]").to_s,
            "outcome"   => event.get("[event][outcome]").to_s,
            "protocol"  => event.get("[network][protocol]").to_s,
            "source_ip" => event.get("[source][ip]").to_s,
            "session"   => event.get("[cowrie][session]").to_s,
            "user"      => event.get("[user][name]").to_s,
            "command"   => event.get("[process][command_line]").to_s,
          }

          @bus.xadd(@bus_stream, payload, maxlen: @bus_maxlen, approximate: true)
        rescue => e
          # El bus es secundario frente a la persistencia: si falla, el evento igual se indexa.
          # Se marca para que la ausencia quede visible en lugar de silenciosa.
          event.tag("_bus_publish_failed")
          event.set("[@metadata][bus_error]", e.class.to_s)
          @bus = nil
        end
      '
    }
  }
}
