# Normaliza los eventos de Cowrie al Elastic Common Schema (ECS).
#
# Cowrie emite un objeto JSON por evento, con un campo `eventid` que dice el tipo
# (cowrie.session.connect, cowrie.login.success, cowrie.command.input, ...). Cada tipo mapea a la
# categoría y la acción ECS que le corresponden. Los campos sin equivalente en ECS quedan bajo
# nuestro propio [cowrie][*].
#
# Referencia ECS usada: categorización (event.kind/category/type/outcome), source/destination,
# network, user, process, file, url, related.

filter {
  if [honeypot] == "cowrie" {

    # se descartan los healthchecks del propio contenedor (localhost hablándose solo), no son ataques
    if [src_ip] == "127.0.0.1" {
      drop {}
    }

    # Se saca la metadata de Filebeat para que no choque con nuestros campos ECS: sin esto, un
    # add_field sobre [ecs][version] lo convertiría en arreglo. Filebeat se reserva [input] para su
    # propia metadata, así que acá siempre es basura y se descarta; el comando de Cowrie se recupera
    # más abajo desde [message].
    mutate {
      remove_field => ["[ecs]", "[agent]", "[host]", "[input]", "[log]", "[@version]"]
    }

    # event timestamp
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure_cowrie"]
    }

    # metadata del observador y base de la categorización
    mutate {
      add_field => {
        "[ecs][version]"      => "8.11.0"
        "[event][module]"     => "cowrie"
        "[event][kind]"       => "event"
        "[event][provider]"   => "cowrie"
        "[observer][type]"    => "honeypot"
        "[observer][vendor]"  => "cowrie"
        "[network][transport]" => "tcp"
      }
    }
    if [eventid] {
      mutate { add_field => { "[event][dataset]" => "%{eventid}" } }
    }

    # la terna de red (origen, destino, red)
    if [src_ip]   { mutate { rename => { "src_ip"   => "[source][ip]" } } }
    if [src_port] { mutate { rename => { "src_port" => "[source][port]" } } }
    # dst_ip no siempre es una dirección. En los eventos direct-tcpip (el atacante pidiendo que el
    # equipo comprometido abra una conexión hacia afuera) Cowrie registra el destino tal como se lo
    # pidieron, y eso suele ser un nombre ("google.com", "ip-who.com"). Mandarlo a destination.ip,
    # que está tipado como ip, hace que Elasticsearch rechace el documento completo: el evento no
    # llega al índice, y como toda la validación consulta el índice, la pérdida es invisible.
    # Se separa por forma: dirección a destination.ip, nombre a destination.domain.
    if [dst_ip] {
      if [dst_ip] =~ /^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$/ or [dst_ip] =~ /^[0-9A-Fa-f:]*:[0-9A-Fa-f:]*$/ {
        mutate { rename => { "dst_ip" => "[destination][ip]" } }
      } else {
        mutate { rename => { "dst_ip" => "[destination][domain]" } }
      }
    }
    if [dst_port] { mutate { rename => { "dst_port" => "[destination][port]" } } }
    if [protocol] { mutate { rename => { "protocol" => "[network][protocol]" } } }
    if [sensor]   { mutate { rename => { "sensor"   => "[observer][name]" } } }

    # campos propios de Cowrie que no tienen equivalente directo en ECS
    if [session] { mutate { rename => { "session" => "[cowrie][session]" } } }
    if [uuid]    { mutate { rename => { "uuid"    => "[cowrie][uuid]" } } }

    # categorización ECS según el tipo de evento
    if [eventid] == "cowrie.session.connect" {
      mutate {
        add_field => {
          "[event][action]" => "session-connect"
          "[event][type]"   => "start"
          "[event][category]" => "network"
        }
      }
    } else if [eventid] == "cowrie.session.closed" {
      mutate {
        add_field => {
          "[event][action]" => "session-closed"
          "[event][type]"   => "end"
          "[event][category]" => "network"
        }
      }
      # la duración viene en segundos (float) y ECS la pide en nanosegundos en event.duration
      if [duration] {
        ruby {
          code => "event.set('[event][duration]', (event.get('duration').to_f * 1000000000).to_i)"
        }
        mutate { rename => { "duration" => "[cowrie][duration_seconds]" } }
      }
    } else if [eventid] == "cowrie.login.success" {
      mutate {
        add_field => {
          "[event][action]"  => "login"
          "[event][type]"    => "info"
          "[event][category]" => "authentication"
          "[event][outcome]" => "success"
        }
      }
    } else if [eventid] == "cowrie.login.failed" {
      mutate {
        add_field => {
          "[event][action]"  => "login"
          "[event][type]"    => "info"
          "[event][category]" => "authentication"
          "[event][outcome]" => "failure"
        }
      }
    } else if [eventid] == "cowrie.command.input" {
      mutate {
        add_field => {
          "[event][action]"  => "command-input"
          "[event][type]"    => "info"
          "[event][category]" => "process"
        }
      }
    } else if [eventid] == "cowrie.command.failed" {
      mutate {
        add_field => {
          "[event][action]"  => "command-failed"
          "[event][type]"    => "info"
          "[event][category]" => "process"
          "[event][outcome]" => "failure"
        }
      }
    } else if [eventid] == "cowrie.command.success" {
      mutate {
        add_field => {
          "[event][action]"  => "command-success"
          "[event][type]"    => "info"
          "[event][category]" => "process"
          "[event][outcome]" => "success"
        }
      }
    } else if [eventid] in ["cowrie.session.file_download", "cowrie.session.file_upload", "cowrie.session.file_download.failed"] {
      mutate {
        add_field => {
          "[event][type]"    => "creation"
          "[event][category]" => "file"
        }
      }
      if [eventid] == "cowrie.session.file_upload" {
        mutate { add_field => { "[event][action]" => "file-upload" } }
      } else if [eventid] == "cowrie.session.file_download.failed" {
        mutate { add_field => { "[event][action]" => "file-download" "[event][outcome]" => "failure" } }
      } else {
        mutate { add_field => { "[event][action]" => "file-download" } }
      }
    } else if [eventid] == "cowrie.direct-tcpip.request" {
      mutate {
        add_field => {
          "[event][action]"  => "direct-tcpip-request"
          "[event][type]"    => "connection"
          "[event][category]" => "network"
        }
      }
    } else {
      # client.version, client.kex, client.fingerprint, session.params, log.closed,
      # direct-tcpip.data, telnet.option, etc. all protocol/session events -> network
      if [eventid] {
        mutate {
          add_field => {
            "[event][action]"   => "%{eventid}"
            "[event][type]"     => "info"
            "[event][category]" => "network"
          }
        }
      }
    }

    # resultado por defecto, para los eventos que no declaran uno
    if ![event][outcome] {
      mutate { add_field => { "[event][outcome]" => "unknown" } }
    }

    # auth / user
    if [username] {
      mutate {
        rename => { "username" => "[user][name]" }
        add_field => { "[related][user]" => "%{[user][name]}" }
      }
    }
    if [password] { mutate { rename => { "password" => "[cowrie][password]" } } }

    # Comandos: el comando cae en [message] con un prefijo, porque Filebeat pisa el campo [input] de
    # Cowrie con su propia metadata y ese queda inservible. Se copia y se sacan los tres prefijos que
    # usa Cowrie, uno por tipo de evento: "CMD: " al tipearlo, y "Command found: " o "Command not
    # found: " cuando la consola resuelve si existe.
    #
    # Sacaba solo el primero, y los otros dos se colaban en el comando. Son 3.245 eventos, el 9,5 %
    # de los de categoría process: el motor de triaje los recibía como "Command found: uname -s -v",
    # que es la línea del log y no lo que escribió el atacante.
    if [eventid] in ["cowrie.command.input", "cowrie.command.failed", "cowrie.command.success"] {
      mutate { copy => { "message" => "[process][command_line]" } }
      mutate { gsub => ["[process][command_line]", "^(CMD: |Command (not )?found: )", ""] }
    }

    # artefactos y archivos descargados
    if [url]    { mutate { rename => { "url"    => "[url][original]" } } }
    if [shasum] { mutate { rename => { "shasum" => "[file][hash][sha256]" } } }
    if [outfile]  { mutate { rename => { "outfile"  => "[cowrie][outfile]" } } }
    if [destfile] { mutate { rename => { "destfile" => "[file][name]" } } }
    if [filename] { mutate { rename => { "filename" => "[file][name]" } } }

    # huella del cliente SSH
    if [version]      { mutate { rename => { "version"      => "[cowrie][client_version]" } } }
    if [hassh]        { mutate { rename => { "hassh"        => "[cowrie][hassh]" } } }
    if [hasshAlgorithms] { mutate { rename => { "hasshAlgorithms" => "[cowrie][hassh_algorithms]" } } }

    # related.ip, cómodo para correlacionar; lo usan el análisis exploratorio y el agente
    if [source][ip]      { mutate { add_field => { "[related][ip]" => "%{[source][ip]}" } } }
    if [destination][ip] { mutate { add_field => { "[related][ip]" => "%{[destination][ip]}" } } }

    # related.hosts es el equivalente de related.ip para nombres: permite buscar un dominio de
    # mando y control sin saber de antemano en qué campo quedó registrado.
    if [destination][domain] {
      mutate { add_field => { "[related][hosts]" => "%{[destination][domain]}" } }
    }

    # se descartan los campos redundantes y de transporte
    mutate {
      remove_field => ["timestamp", "log", "input", "input_type", "ecs_agent",
                       "agent", "host", "@version", "src_ip_geo"]
    }

    # id determinístico, así reingerir es idempotente y no duplica
    fingerprint {
      source => ["[cowrie][session]", "[event][dataset]", "message",
                 "[source][ip]", "[source][port]", "@timestamp"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][doc_id]"
    }
  }
}
