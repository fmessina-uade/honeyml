# Output to Elasticsearch.
# Daily indices per honeypot: honeypot-cowrie-YYYY.MM.dd / honeypot-dionaea-YYYY.MM.dd
# The deterministic document_id (fingerprint) makes re-ingestion idempotent: reprocessing the
# same logs doesn't create duplicates.
output {
  if [honeypot] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-%{[honeypot]}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      action => "index"
      # the composable template is applied outside Logstash (scripts/es_bootstrap.sh)
      manage_template => false
    }
  } else {
    # events with no identifiable honeypot -> dead-letter index for debugging
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-unrouted-%{+YYYY.MM.dd}"
      manage_template => false
    }
  }
}
