# Salida a Elasticsearch.
# Un índice por día y por honeypot: honeypot-cowrie-YYYY.MM.dd / honeypot-dionaea-YYYY.MM.dd
# El document_id determinístico (la huella) hace que reingerir sea idempotente: reprocesar los
# mismos registros no crea duplicados.
output {
  if [honeypot] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-%{[honeypot]}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      action => "index"
      # la plantilla componible se aplica fuera de Logstash (scripts/es_bootstrap.sh)
      manage_template => false
    }
  } else {
    # los eventos sin honeypot identificable van al índice de descarte, para poder diagnosticar
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-unrouted-%{+YYYY.MM.dd}"
      manage_template => false
    }
  }
}
