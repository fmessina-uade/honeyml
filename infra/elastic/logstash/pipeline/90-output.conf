# Salida hacia Elasticsearch.
# Índices diarios por honeypot: honeypot-cowrie-YYYY.MM.dd / honeypot-dionaea-YYYY.MM.dd
# El document_id determinista (fingerprint) hace la reingesta idempotente: reprocesar los
# mismos logs no genera duplicados.
output {
  if [honeypot] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-%{[honeypot]}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      action => "index"
      # La plantilla componible se aplica fuera de Logstash (scripts/es_bootstrap.sh)
      manage_template => false
    }
  } else {
    # Eventos sin honeypot identificable -> índice de descarte para diagnóstico
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-unrouted-%{+YYYY.MM.dd}"
      manage_template => false
    }
  }
}
