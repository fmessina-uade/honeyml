services:

  # El bus en tiempo real entre el pipeline de normalización y el motor de triaje, sobre los streams
  # de Valkey.
  #
  # Vive en la zona de análisis y no en la de captura: los sensores nunca lo alcanzan. El pipeline
  # publica acá después de normalizar, y el motor consume con un grupo de consumidores, que es lo
  # que da el acuse explícito: un evento tomado y no confirmado queda pendiente, y se puede reclamar
  # si el consumidor se muere en el medio.
  valkey:
    # Valkey 9.1.2, fijada por digest como los sensores. Es BSD-3-Clause y habla el mismo protocolo
    # que Redis, así que los clientes de Python y de Logstash no cambian.
    image: valkey/valkey@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: valkey
    hostname: valkey
    restart: unless-stopped
    # `--requirepass` con la clave del entorno. Vacía quiere decir sin autenticación, como en una
    # prueba local; en el servidor la fija el `.env` y el bus la exige. La misma clave entra al
    # contenedor como variable, para que el chequeo de salud pueda autenticarse cuando está puesta.
    command: >-
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${BUS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --requirepass "${BUS_PASSWORD:-}"
      --save ""
    environment:
      - BUS_PASSWORD=${BUS_PASSWORD:-}
    volumes:
      - valkey_data:/data
    # atado a loopback, nunca expuesto en la interfaz pública del VPS
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - elastic_net
    healthcheck:
      # Se autentica solo si hay clave: `$${BUS_PASSWORD:+...}` agrega `-a` nada más cuando está
      # puesta, así el mismo chequeo sirve con y sin autenticación. El `$$` deja que lo expanda el
      # shell del contenedor y no Compose.
      test:
        - CMD-SHELL
        - valkey-cli $${BUS_PASSWORD:+-a "$$BUS_PASSWORD"} --no-auth-warning ping | grep -q PONG
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${BUS_MEM_LIMIT:-768m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # se une a la red de análisis para que Logstash pueda publicar sin cruzar de zona
  elastic_net:
    external: true
    name: elastic_net

volumes:
  valkey_data:
    name: valkey_data
